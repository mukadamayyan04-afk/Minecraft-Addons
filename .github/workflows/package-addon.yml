name: Build and Publish Solo Leveling Addon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "SoloLeveling-BP/**"
      - "SoloLeveling-RP/**"
      - ".github/workflows/package-addon.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate pack manifests
        run: |
          python3 - <<'PY'
          import json
          for path in ["SoloLeveling-BP/manifest.json", "SoloLeveling-RP/manifest.json"]:
              with open(path, encoding="utf-8") as f:
                  manifest = json.load(f)
              assert manifest.get("format_version") == 2, f"Invalid format_version: {path}"
              assert manifest.get("header", {}).get("uuid"), f"Missing header UUID: {path}"
              assert manifest.get("modules"), f"Missing modules: {path}"
              print(f"Validated {path}")
          PY

      - name: Package MCPACK and MCADDON files
        run: |
          mkdir -p dist
          (cd SoloLeveling-BP && zip -qr ../dist/SoloLeveling-BP.mcpack .)
          (cd SoloLeveling-RP && zip -qr ../dist/SoloLeveling-RP.mcpack .)
          zip -qr dist/SoloLeveling.mcaddon SoloLeveling-BP SoloLeveling-RP
          ls -lh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Solo-Leveling-Minecraft-Addon
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct-download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Solo Leveling Addon
          body: |
            Automatically generated Minecraft Bedrock addon packages.

            Download SoloLeveling.mcaddon to import both packs together.
            The individual BP and RP .mcpack files are also available below.
          files: |
            dist/SoloLeveling.mcaddon
            dist/SoloLeveling-BP.mcpack
            dist/SoloLeveling-RP.mcpack
          overwrite_files: true
          make_latest: true
